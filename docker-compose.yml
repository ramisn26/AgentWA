# AgentWA — copy of ForgeChat/AgentCRM, isolated from the production stack.
# PostgreSQL + Redis + backend + frontend.
#
# Run with:   docker compose up -d --build
# Served at:  https://crackers.pavirami.in (via the existing Caddy reverse proxy)
#
# Optional root .env overrides: POSTGRES_PASSWORD, HTTP_PORT, and backend
# feature keys (e.g. OPENAI_API_KEY).
# Requires Docker Compose v2.24+.

name: agentwa   # separate project name: its own containers, network and volumes

services:
  forgecrm-db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      # Set a strong value in .env. Changing it later requires `docker compose down -v`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgechat}
    # No host port: the backend reaches the DB over the Docker network.
    # For debugging only, uncomment (5432 is used by prod):
    # ports:
    #   - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  forgecrm-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3011"                     # the frontend (nginx) proxies to forgecrm-backend:3011
      CORS_ORIGIN: https://crackers.pavirami.in
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-forgechat}@forgecrm-db:5432/postgres
      REDIS_URL: redis://redis:6379
      FORGECHAT_DATA_DIR: /app/data    # persisted auto-generated secrets live here
    env_file:
      - path: .env                     # optional advanced overrides; absent is fine
        required: false
    volumes:
      - secrets:/app/data              # JWT + encryption key — KEEP THIS VOLUME
      - media:/app/media               # downloaded inbound/outbound chat media
      - uploads:/app/uploads           # profile pictures / uploaded files
    depends_on:
      forgecrm-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  agentwa-frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      # Bound to localhost only; public access goes through Caddy.
      # 8081 avoids a clash with prod on 8080.
      - "127.0.0.1:${HTTP_PORT:-8081}:80"
    depends_on:
      - forgecrm-backend

volumes:
  pgdata:
  redisdata:
  secrets:
  media:
  uploads:
networks:
edge:
  name: agentwa_edge
